name: Contrôles qualité

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: En-têtes SPDX, i18n, mentions interdites et placeholders
        run: npm run verifier
      - name: Cohérence de la documentation
        if: github.event_name == 'pull_request'
        run: npx tsx scripts/verifier-docs.ts --base origin/${{ github.base_ref }}
      - name: Tests unitaires
        run: npm test
      - name: Formatage (Prettier)
        run: npm run format:verifier
      - name: Lint
        run: npm run lint
      - name: Types et build
        run: npm run build
      - name: Budget de performance
        run: npm run verifier:budget
      - name: Navigateurs pour les tests de bout en bout
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Tests de bout en bout et accessibilité
        run: npm run e2e
